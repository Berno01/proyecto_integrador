<div class="lineas-container">
  <div class="page-header">
    <div class="page-header-text">
      <h1>Líneas de producto</h1>
      <p class="page-subtitle">Clasificación de vinos, singanis e insumos</p>
    </div>
    <button class="btn btn-primary" (click)="nuevaCategoria()" [disabled]="isLoading">
      + Nueva línea
    </button>
  </div>

  <!-- Loading -->
  <div *ngIf="isLoading" class="loading-container">
    <div class="spinner"></div>
    <p>Cargando líneas de producto...</p>
  </div>

  <!-- Error -->
  <div *ngIf="errorMessage && !isLoading" class="alert alert-error">
    <span>{{ errorMessage }}</span>
    <button class="btn btn-retry" (click)="cargarCategorias()">Reintentar</button>
  </div>

  <!-- Tabla de líneas -->
  <div *ngIf="!isLoading && !errorMessage" class="table-container">
    <table *ngIf="categorias.length > 0" class="lineas-table">
      <thead>
        <tr>
          <th>ID</th>
          <th>Nombre de línea</th>
          <th class="th-acciones">Acciones</th>
        </tr>
      </thead>
      <tbody>
        <tr *ngFor="let categoria of categorias">
          <td class="id-cell">{{ categoria.idCategoria }}</td>
          <td class="nombre-cell">{{ categoria.nombreCategoria }}</td>
          <td class="acciones-cell">
            <button
              class="btn-action btn-edit"
              (click)="editarCategoria(categoria.idCategoria!)"
              title="Editar línea"
            >
              Editar
            </button>
            <button
              class="btn-action btn-delete"
              (click)="eliminarCategoria(categoria.idCategoria!, categoria.nombreCategoria)"
              title="Eliminar línea"
            >
              Eliminar
            </button>
          </td>
        </tr>
      </tbody>
    </table>

    <!-- Empty State -->
    <div *ngIf="categorias.length === 0" class="empty-state">
      <p>No hay líneas de producto registradas</p>
      <button class="btn btn-primary" (click)="nuevaCategoria()">Crear primera línea</button>
    </div>
  </div>
</div>
